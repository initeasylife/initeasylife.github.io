<!doctype html>
<html lang="{{ site.lang }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
      {% if page.title %}{{ page.title | escape }} ·{% endif %}
      {{ site.title }}
    </title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta name="theme-color" content="#f6f7f4">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    {% feed_meta %}
    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
    {% if page.math %}
      <script>
        window.MathJax = {
          tex: {
            inlineMath: [
              ['$', '$'],
              ['\\(', '\\)'],
            ],
            displayMath: [
              ['$$', '$$'],
              ['\\[', '\\]'],
            ],
            processEscapes: true,
          },
          options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] },
        };
      </script>
      <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml.js"></script>
    {% endif %}
  </head>
  <body>
    {% assign documents = site.posts | concat: site.notes %}
    <a class="skip-link" href="#main-content">跳到正文</a>
    {% include sidebar.html %}
    <div class="site-main">
      <header class="topbar">
        <div class="topbar-location">
          <button class="menu-toggle" aria-label="展开导航" aria-expanded="false" aria-controls="site-sidebar">
            {% include icon.html name='menu' %}
          </button>
          <span class="topbar-home">知识花园</span>
          <span class="breadcrumb-slash">/</span>
          <span>{{ page.breadcrumb | default: page.title | default: '知识概览' }}</span>
        </div>
        <form class="header-search" action="{{ '/library/' | relative_url }}" role="search">
          <label class="sr-only" for="global-search">搜索文档</label>
          {% include icon.html name='search' -%}
          <input id="global-search" type="search" name="q" placeholder="搜索笔记、关键词…" autocomplete="off">
          <kbd>/</kbd>
        </form>
      </header>
      <main id="main-content" tabindex="-1">{{ content }}</main>
      <footer class="site-footer">
        <span>把零散的知识，慢慢连成一片。</span>
        <a href="{{ '/about/' | relative_url }}">
          Made with curiosity
          <span>↗</span>
        </a>
      </footer>
    </div>
  </body>
</html>
