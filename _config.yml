title: initeasylife
tagline: 保持好奇，持续生长。
description: 算法、数学与实践的个人知识库。在这里记录推导，连接知识，也留下尚未解答的问题。
email: initeasylife@gmail.com
github_username: initeasylife
url: "https://initeasylife.github.io"
baseurl: ""
lang: zh-CN
timezone: Asia/Shanghai
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  math_engine: mathjax
highlighter: rouge
plugins:
  - jekyll-feed
whitelist:
  - jekyll-feed
collections:
  notes:
    output: true
    permalink: /notes/:path/
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      kind: 学习笔记
      math: true
  - scope:
      path: ""
      type: notes
    values:
      layout: post
      kind: 阅读札记
      math: true
      undated: true
destination: .build
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - scripts
  - .idea
  - .bundle
  - .build
  - _site
  - .sass-cache
